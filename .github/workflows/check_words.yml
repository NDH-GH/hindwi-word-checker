name: Hindwi Dictionary Word Checker

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - 'hindwi_validation_results.csv'
      - 'Validated_word_list_with_hindwi.xlsx'

permissions:
  contents: write

jobs:
  check-words:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests openpyxl

      - name: Run word verification script (multi-threaded)
        run: |
          python check_hindwi.py --workers 6

      - name: Commit and push progress
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add hindwi_validation_results.csv || true
          git add Validated_word_list_with_hindwi.xlsx || true
          git diff --staged --quiet || (git commit -m "Update Hindwi verification progress [skip ci]" && git push)
