name: Hindwi Dictionary Word Checker

on:
  workflow_dispatch: # Allows manual trigger from GitHub Actions UI anytime
  schedule:
    # Optional: runs every 4 hours automatically to continue processing
    - cron: '0 */4 * * *'

permissions:
  contents: write

jobs:
  check-words:
    runs-on: ubuntu-latest
    timeout-minutes: 350 # Max ~5.8 hours (GitHub Actions allows up to 6 hours)

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests openpyxl

      - name: Run word verification script
        run: |
          python check_hindwi.py

      - name: Commit and push progress
        if: always() # Always run to save checkpoint even if step is cancelled or timed out
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add hindwi_validation_results.csv Validated_word_list_with_hindwi.xlsx || true
          git diff --staged --quiet || (git commit -m "Update Hindwi verification progress [skip ci]" && git push)
